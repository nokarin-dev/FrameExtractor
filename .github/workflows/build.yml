name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip build test gate'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  check-tests:
    name: Verify build tests passed
    runs-on: ubuntu-latest
    steps:
      - name: Check latest test workflow run
        uses: actions/github-script@v7
        with:
          script: |
            const skip = '${{ github.event.inputs.skip_tests }}' === 'true';
            if (skip) {
              core.warning('Build test gate skipped by manual override');
              return;
            }
            
            const tagRef = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${context.ref.replace('refs/tags/', '')}`,
            }).catch(() => null);
            
            const sha = tagRef?.data?.object?.sha || context.sha;
            
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-test.yml',
              head_sha: sha,
              per_page: 5,
            });
            
            const passing = runs.data.workflow_runs.find(
              r => r.conclusion === 'success'
            );
            
            if (!passing) {
              core.setFailed(
                `No passing build test found for commit ${sha}. ` +
                `Run the Build Test workflow first, or use workflow_dispatch ` +
                `with skip_tests=true for an emergency release.`
              );
            } else {
              core.info(`Build tests passed: ${passing.html_url}`);
            }

  # Download ffmpeg & yt-dlp
  prepare-binaries:
    name: Download ffmpeg & yt-dlp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache binaries
        id: cache-bins
        uses: actions/cache@v4
        with:
          path: assets/binaries
          key: binaries-${{ hashFiles('scripts/prepare_binaries.py') }}-v1

      - name: Download binaries
        if: steps.cache-bins.outputs.cache-hit != 'true'
        run: python3 scripts/prepare_binaries.py --all

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: assets/binaries
          retention-days: 1

  # Windows
  build-windows:
    name: Windows
    needs: prepare-binaries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: assets/binaries

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - run: flutter pub get

      # Installer
      - name: Build Windows (installer)
        run: flutter build windows --release --dart-define=PORTABLE=false

      - name: Inject binaries — installer
        shell: pwsh
        run: |
          $dest = "build\windows\x64\runner\Release\bin"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "assets\binaries\windows\ffmpeg.exe" $dest
          Copy-Item "assets\binaries\windows\yt-dlp.exe" $dest

      - name: Create Inno Setup script
        shell: pwsh
        run: |
          $version = (Get-Content pubspec.yaml | Select-String "^version:" | `
            ForEach-Object { $_ -replace "version:\s*", "" } | `
            ForEach-Object { $_ -replace "\+.*", "" }).Trim()
          
          $iss = @"
          [Setup]
          AppName=Frame Extractor
          AppVersion=$version
          AppPublisher=nokarin
          AppPublisherURL=https://github.com/nokarin-dev/frameextractor
          AppSupportURL=https://github.com/nokarin-dev/frameextractor/issues
          DefaultDirName={autopf}\FrameExtractor
          DefaultGroupName=Frame Extractor
          AllowNoIcons=yes
          OutputDir=.
          OutputBaseFilename=FrameExtractor-windows-installer
          Compression=lzma2/ultra64
          SolidCompression=yes
          WizardStyle=modern
          PrivilegesRequiredOverridesAllowed=dialog
          UninstallDisplayIcon={app}\frameextractor.exe
          SetupIconFile=windows\runner\resources\app_icon.ico
          
          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"
          
          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"
          
          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs
          
          [Icons]
          Name: "{group}\Frame Extractor"; Filename: "{app}\frameextractor.exe"
          Name: "{group}\Uninstall Frame Extractor"; Filename: "{uninstallexe}"
          Name: "{commondesktop}\Frame Extractor"; Filename: "{app}\frameextractor.exe"; Tasks: desktopicon
          
          [Run]
          Filename: "{app}\frameextractor.exe"; Description: "{cm:LaunchProgram,Frame Extractor}"; Flags: nowait postinstall skipifsilent
          "@
          
          $iss | Out-File -FilePath "installer.iss" -Encoding UTF8
          Write-Host "Inno Setup script created for version $version"

      - name: Compile installer with Inno Setup
        shell: pwsh
        run: |
          # Inno Setup is pre-installed on GitHub Actions Windows runners
          $inno = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $inno "installer.iss"
          Write-Host "Installer compiled: FrameExtractor-windows-installer.exe"

      # Portable
      - name: Build Windows (portable)
        run: flutter build windows --release --dart-define=PORTABLE=true

      - name: Inject binaries — portable
        shell: pwsh
        run: |
          $dest = "build\windows\x64\runner\Release\bin"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "assets\binaries\windows\ffmpeg.exe" $dest
          Copy-Item "assets\binaries\windows\yt-dlp.exe" $dest

      - name: Package Windows portable
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "FrameExtractor-windows-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: |
            FrameExtractor-windows-installer.zip
            FrameExtractor-windows-portable.zip

  #.Linux
  build-linux:
    name: Linux
    needs: prepare-binaries
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: assets/binaries

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - run: flutter pub get

      # Installer
      - name: Build Linux (installer)
        run: flutter build linux --release --dart-define=PORTABLE=false

      - name: Inject binaries (installer)
        run: |
          mkdir -p build/linux/x64/release/bundle/bin
          cp assets/binaries/linux/ffmpeg build/linux/x64/release/bundle/bin/
          cp assets/binaries/linux/yt-dlp build/linux/x64/release/bundle/bin/
          chmod +x build/linux/x64/release/bundle/bin/*

      - name: Package Linux installer
        run: |
          tar -czf FrameExtractor-linux-installer.tar.gz \
            -C build/linux/x64/release/bundle .

      # Portable
      - name: Build Linux (portable)
        run: flutter build linux --release --dart-define=PORTABLE=true

      - name: Inject binaries (portable)
        run: |
          mkdir -p build/linux/x64/release/bundle/bin
          cp assets/binaries/linux/ffmpeg build/linux/x64/release/bundle/bin/
          cp assets/binaries/linux/yt-dlp  build/linux/x64/release/bundle/bin/
          chmod +x build/linux/x64/release/bundle/bin/*

      - name: Package Linux portable
        run: |
          tar -czf FrameExtractor-linux-portable.tar.gz \
            -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: |
            FrameExtractor-linux-installer.tar.gz
            FrameExtractor-linux-portable.tar.gz

  # Android APK
  build-android:
    name: Android
    needs: prepare-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: assets/binaries

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - run: flutter pub get

      # Signing
      - name: Setup release signing
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks
          cat > android/key.properties << EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF

      # Build split APKs
      - name: Build split APKs
        run: |
          flutter build apk --release --dart-define=PORTABLE=false --split-per-abi

      - name: Rename APKs
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk FrameExtractor-android-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk FrameExtractor-android-arm32.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk FrameExtractor-android-x86_64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            FrameExtractor-android-arm64.apk
            FrameExtractor-android-arm32.apk
            FrameExtractor-android-x86_64.apk

  # macOS
  build-macos:
    name: macOS
    needs: prepare-binaries
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: assets/binaries

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - run: flutter pub get

      # Installer
      - name: Build macOS installer
        run: flutter build macos --release --dart-define=PORTABLE=false

      - name: Inject binaries (installer)
        run: |
          APP="build/macos/Build/Products/Release/frameextractor.app"
          mkdir -p "$APP/Contents/MacOS/bin"
          cp assets/binaries/macos/ffmpeg "$APP/Contents/MacOS/bin/"
          cp assets/binaries/macos/yt-dlp "$APP/Contents/MacOS/bin/"
          chmod +x "$APP/Contents/MacOS/bin/"*

      - name: Package installer (dmg)
        run: |
          hdiutil create -volname "FrameExtractor" \
            -srcfolder "build/macos/Build/Products/Release/frameextractor.app" \
            -ov -format UDZO "FrameExtractor-macos-installer.dmg"

      # Portable
      - name: Build macOS (portable)
        run: flutter build macos --release --dart-define=PORTABLE=true

      - name: Inject binaries — portable
        run: |
          APP="build/macos/Build/Products/Release/frameextractor.app"
          mkdir -p "$APP/Contents/MacOS/bin"
          cp assets/binaries/macos/ffmpeg "$APP/Contents/MacOS/bin/"
          cp assets/binaries/macos/yt-dlp "$APP/Contents/MacOS/bin/"
          chmod +x "$APP/Contents/MacOS/bin/"*

      - name: Package portable (zip)
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "build/macos/Build/Products/Release/frameextractor.app" \
            "FrameExtractor-macos-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-builds
          path: |
            FrameExtractor-macos-installer.dmg
            FrameExtractor-macos-portable.zip

  # iOS
  build-ios:
    name: iOS
    needs: prepare-binaries
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Patch ffmpeg_kit podspec deployment target
        run: |
          # ffmpeg_kit_flutter_new podspec reports incorrect minimum deployment
          # target — patch it directly so CocoaPods can resolve dependencies
          PODSPEC=$(find "$HOME/.pub-cache" \
            -path "*/ffmpeg_kit_flutter_new*/*.podspec" 2>/dev/null | head -1)
          if [ -z "$PODSPEC" ]; then
            PODSPEC=$(find . \
              -path "*/.symlinks/plugins/ffmpeg_kit_flutter_new/ios/*.podspec" \
              2>/dev/null | head -1)
          fi
          if [ -n "$PODSPEC" ]; then
            echo "Patching: $PODSPEC"
            python3 -c "
              import re, sys
              f = open('$PODSPEC').read()
              f = re.sub(r\"s\\.ios\\.deployment_target\\s*=\\s*'[0-9.]+'\",
              \"s.ios.deployment_target = '13.0'\", f)
              f = re.sub(r\"s\\.deployment_target\\s*=\\s*'[0-9.]+'\",
              \"s.deployment_target = '13.0'\", f)
              open('$PODSPEC', 'w').write(f)
              print('done')
            "
          else
            echo "podspec not found in pub cache — will attempt build anyway"
          fi

          # Also patch xcodeproj
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          if [ -f "$PBXPROJ" ]; then
            python3 -c "
              import re
              f = open('$PBXPROJ').read()
              f = re.sub(r'IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+',
              'IPHONEOS_DEPLOYMENT_TARGET = 13.0', f)
              open('$PBXPROJ', 'w').write(f)
              print('xcodeproj patched')
            "
          fi

      - name: Import signing certificate
        env:
          IOS_CERT: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        if: env.IOS_CERT != ''
        run: |
          echo "${{ secrets.IOS_CERTIFICATE_BASE64 }}" | base64 -d > /tmp/cert.p12
          security create-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "${{ secrets.IOS_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign
          security list-keychains -s build.keychain
          security set-keychain-settings build.keychain
          security unlock-keychain -p "" build.keychain
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 -d \
            > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Build iOS (signed)
        env:
          IOS_CERT: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        if: env.IOS_CERT != ''
        run: |
          flutter build ipa --release \
            --dart-define=PORTABLE=false \
            --export-options-plist=ios/ExportOptions.plist
          cp build/ios/ipa/*.ipa FrameExtractor-ios.ipa

      - name: Build iOS (unsigned — sideload)
        env:
          IOS_CERT: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        if: env.IOS_CERT == ''
        run: |
          flutter build ios --release --no-codesign --dart-define=PORTABLE=false
          mkdir -p Payload
          cp -r build/ios/Release-iphoneos/Runner.app Payload/
          zip -r FrameExtractor-ios-unsigned.ipa Payload/
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            FrameExtractor-ios.ipa
            FrameExtractor-ios-unsigned.ipa
        if: always()

  # Release
  release:
    name: Create Release
    needs: [build-windows, build-linux, build-android, build-macos, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*-build*"
          merge-multiple: true

      - name: Generate changelog
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_BARE="${VERSION#v}"

          SECTION=$(awk \
            "/^## \[$VERSION_BARE\]/{found=1; next} found && /^## \[/{exit} found{print}" \
            CHANGELOG.md)

          if [ -z "$SECTION" ]; then
            PREV_TAG=$(git tag --sort=-version:refname | sed -n '2p')
            if [ -z "$PREV_TAG" ]; then
              SECTION=$(git log --oneline --no-decorate | head -20)
            else
              SECTION=$(git log --oneline --no-decorate ${PREV_TAG}..HEAD)
            fi
          fi

          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$SECTION" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Frame Extractor ${{ github.ref_name }}"
          body: |
            ${{ env.CHANGELOG }}

            ---

            ## Downloads

            | Platform | File | Notes |
            |---|---|---|
            | 🪟 Windows | `FrameExtractor-windows-installer.zip` | Extract & run `.exe` |
            | 🪟 Windows Portable | `FrameExtractor-windows-portable.zip` | No install needed |
            | 🐧 Linux | `FrameExtractor-linux-installer.tar.gz` | Extract & run |
            | 🐧 Linux Portable | `FrameExtractor-linux-portable.tar.gz` | Self-contained folder |
            | 🍎 macOS | `FrameExtractor-macos-installer.dmg` | Open dmg & drag to Applications |
            | 🍎 macOS Portable | `FrameExtractor-macos-portable.zip` | Extract & run anywhere |
            | 🤖 Android (arm64) | `FrameExtractor-android-arm64.apk` | Most modern phones (2018+) |
            | 🤖 Android (arm32) | `FrameExtractor-android-arm32.apk` | Older 32-bit phones |
            | 🤖 Android (x86_64) | `FrameExtractor-android-x86_64.apk` | Emulators / Chromebooks |
            | 📱 iOS | `FrameExtractor-ios.ipa` / `FrameExtractor-ios-unsigned.ipa` | Sideload via AltStore/TrollStore |

            > **Windows/Linux/macOS:** ffmpeg & yt-dlp bundled inside the zip/dmg.
            > **Android:** yt-dlp bundled in APK, ffmpeg via ffmpeg_kit.
            > **iOS:** ffmpeg via ffmpeg_kit, YouTube via API.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/FrameExtractor-windows-installer.zip
            dist/FrameExtractor-windows-portable.zip
            dist/FrameExtractor-linux-installer.tar.gz
            dist/FrameExtractor-linux-portable.tar.gz
            dist/FrameExtractor-macos-installer.dmg
            dist/FrameExtractor-macos-portable.zip
            dist/FrameExtractor-android-arm64.apk
            dist/FrameExtractor-android-arm32.apk
            dist/FrameExtractor-android-x86_64.apk
            dist/FrameExtractor-ios.ipa
            dist/FrameExtractor-ios-unsigned.ipa
          token: ${{ secrets.GITHUB_TOKEN }}
